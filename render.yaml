# Render Blueprint - Auto-deploy both backend and frontend
# See: https://render.com/docs/blueprint-spec

services:
  # Go Backend API + WebSocket Server
  - type: web
    name: connect-four-backend
    runtime: go
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: go build -o app .
    startCommand: ./app
    envVars:
      - key: PORT
        value: 8080
    healthCheckPath: /api/health

  # React Frontend (Static Site)
  - type: web
    name: connect-four-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_WS_URL
        value: wss://connect-four-backend-xalu.onrender.com/ws
      - key: VITE_API_URL
        value: https://connect-four-backend-xalu.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
