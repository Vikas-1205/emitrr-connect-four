# Render Blueprint - Auto-deploy both backend and frontend
# See: https://render.com/docs/blueprint-spec

services:
  # Go Backend API + WebSocket Server
  - type: web
    name: connect-four-backend
    env: go
    region: oregon
    plan: free
    buildCommand: cd backend && go build -o server main.go
    startCommand: cd backend && ./server
    envVars:
      - key: PORT
        value: 8080
    healthCheckPath: /api/health

  # React Frontend (Static Site)
  - type: web
    name: connect-four-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_WS_URL
        value: wss://connect-four-backend.onrender.com/ws
      - key: VITE_API_URL
        value: https://connect-four-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
